<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Session & Audit Logs</title>
  <link rel="icon" type="image/png" href="RREDCO_Logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700 flex items-center gap-1.5 text-xs font-semibold">
          <i data-lucide="grid" class="w-4 h-4 text-amber-400"></i> Portal
        </a>
        <div class="h-6 w-px bg-slate-700 mx-1"></div>
        <div class="h-10 px-3 rounded-lg bg-white flex items-center justify-center shadow-md">
          <img src="RREDCO_Logo.png" alt="RREDCO Logo" class="h-7 w-auto object-contain">
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">System Session & Audit Logs</h1>
            <span class="text-xs px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 font-medium">Dev Terminal</span>
          </div>
          <p class="text-xs text-slate-400">Real-Time User Session Monitoring & Activity Profiles</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full text-xs font-semibold border border-emerald-500/30">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live Cloud Sync Active
        </div>
        <div class="flex items-center gap-3 bg-slate-800 px-3 py-1.5 rounded-md border border-slate-700">
          <span id="logUserEmail" class="text-xs text-slate-300 font-medium">Loading...</span>
          <button id="logLogoutBtn" class="text-rose-400 hover:text-rose-300 transition" title="Sign Out">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-6">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="p-4 bg-white border border-slate-200 rounded-xl shadow-sm flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-sky-100 text-sky-700 flex items-center justify-center font-bold"><i data-lucide="users" class="w-6 h-6"></i></div>
        <div><span class="text-xs text-slate-500 font-medium">Tracked User Profiles</span><p id="stat-log-users" class="text-2xl font-bold text-slate-900 mt-0.5">0 Accounts</p></div>
      </div>
      <div class="p-4 bg-white border border-slate-200 rounded-xl shadow-sm flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center font-bold"><i data-lucide="activity" class="w-6 h-6"></i></div>
        <div><span class="text-xs text-slate-500 font-medium">Total Activity Events</span><p id="stat-log-events" class="text-2xl font-bold text-slate-900 mt-0.5">0 Events</p></div>
      </div>
      <div class="p-4 bg-white border border-slate-200 rounded-xl shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold"><i data-lucide="clock" class="w-6 h-6"></i></div>
          <div><span class="text-xs text-slate-500 font-medium">Last Sync Event</span><p id="stat-log-last-sync" class="text-xs font-bold font-mono text-slate-800 mt-1">Just now</p></div>
        </div>
        <button id="btn-clear-system-logs" class="p-2 text-slate-400 hover:text-rose-600 transition" title="Clear Logs History"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </div>
    </div>

    <div class="bg-white p-4 border border-slate-200 rounded-xl shadow-sm flex items-center justify-between">
      <div class="relative w-full sm:w-96">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
        <input type="text" id="log-search-input" placeholder="Search logs by user, event type..." class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono focus:ring-2 focus:ring-amber-500 focus:outline-none" />
      </div>
      <div class="text-xs text-slate-500">Live Firebase Audit Stream</div>
    </div>

    <div class="space-y-4" id="user-log-profiles-container"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref as dbRef, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const ADMIN_EMAIL = "nicholas.grace@rredco.com";
    const firebaseConfig = {
      apiKey: "AIzaSyAslKhO_Wn2l1paJkqWj5lhxX_2YSekynk",
      authDomain: "rredco-database.firebaseapp.com",
      databaseURL: "https://rredco-database-default-rtdb.firebaseio.com",
      projectId: "rredco-database",
      storageBucket: "rredco-database.firebasestorage.app",
      messagingSenderId: "96836268607",
      appId: "1:96836268607:web:dea3fe719d8f8d619fbe8a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    window.appState = { user: null, systemLogs: [] };

    onAuthStateChanged(auth, (user) => {
      if (user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        window.appState.user = user;
        document.getElementById('logUserEmail').textContent = user.email;
        subscribeToLogs();
      } else {
        window.location.href = 'index.html';
      }
    });

    document.getElementById('logLogoutBtn').addEventListener('click', () => signOut(auth));

    function subscribeToLogs() {
      const logsRef = dbRef(database, 'system_activity_logs');
      onValue(logsRef, (snapshot) => {
        const val = snapshot.val();
        if (val) {
          window.appState.systemLogs = Object.values(val).reverse();
          renderSystemLogDashboard();
        }
      });
    }

    function renderSystemLogDashboard() {
      const container = document.getElementById('user-log-profiles-container');
      const searchQuery = (document.getElementById('log-search-input').value || '').toLowerCase();
      const logs = window.appState.systemLogs;

      document.getElementById('stat-log-events').textContent = `${logs.length} Events`;
      const userProfiles = {};

      logs.forEach(log => {
        const email = (log.email || 'unknown@rredco.com').toLowerCase();
        if (!userProfiles[email]) {
          userProfiles[email] = { email: email, lastActive: log.timeFormatted, logs: [] };
        }
        userProfiles[email].logs.push(log);
      });

      const userEmailKeys = Object.keys(userProfiles);
      document.getElementById('stat-log-users').textContent = `${userEmailKeys.length} Accounts`;
      if (logs.length > 0) document.getElementById('stat-log-last-sync').textContent = logs[0].timeFormatted || 'Just now';

      container.innerHTML = userEmailKeys.map((email, idx) => {
        const prof = userProfiles[email];
        const isDev = email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
        const filteredUserLogs = prof.logs.filter(l => !searchQuery || l.type.toLowerCase().includes(searchQuery) || l.details.toLowerCase().includes(searchQuery));
        if (searchQuery && filteredUserLogs.length === 0) return '';

        return `
          <div class="bg-white border ${isDev ? 'border-amber-300 ring-1 ring-amber-200' : 'border-slate-200'} rounded-xl shadow-sm overflow-hidden">
            <div onclick="window.toggleUserLogAccordion('${idx}')" class="px-5 py-4 ${isDev ? 'bg-amber-50/60' : 'bg-slate-50'} cursor-pointer flex items-center justify-between border-b border-slate-200">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full ${isDev ? 'bg-amber-600' : 'bg-slate-800'} text-white flex items-center justify-center font-bold font-mono text-xs">
                  ${email.slice(0, 2).toUpperCase()}
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <h3 class="text-xs sm:text-sm font-bold text-slate-900 font-mono">${email}</h3>
                    ${isDev ? `<span class="px-2 py-0.5 rounded bg-amber-200 text-amber-900 font-sans text-[10px] font-bold">Admin</span>` : ''}
                  </div>
                  <p class="text-[11px] text-slate-500 mt-0.5">Last Active: ${prof.lastActive}</p>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${isDev ? 'bg-amber-200 text-amber-900' : 'bg-sky-100 text-sky-800'}">${filteredUserLogs.length} Actions</span>
                <i id="accordion-icon-${idx}" data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
              </div>
            </div>
            <div id="accordion-body-${idx}" class="p-5 border-t border-slate-100 space-y-2 bg-white">
              ${filteredUserLogs.map(l => `
                <div class="p-3 bg-slate-50 rounded-lg border border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between text-xs">
                  <div class="flex items-center gap-2">
                    <span class="px-2 py-0.5 rounded text-[10px] font-bold font-mono bg-slate-200">${l.type}</span>
                    <span class="font-medium text-slate-800">${l.details}</span>
                  </div>
                  <span class="text-[11px] font-mono text-slate-400">${l.timeFormatted || l.timestamp}</span>
                </div>`).join('')}
            </div>
          </div>`;
      }).join('');
      lucide.createIcons();
    }

    window.toggleUserLogAccordion = (idx) => {
      const body = document.getElementById(`accordion-body-${idx}`);
      body.classList.toggle('hidden');
    };

    document.getElementById('log-search-input').addEventListener('input', renderSystemLogDashboard);
    document.getElementById('btn-clear-system-logs').addEventListener('click', () => {
      if (confirm('Clear all logged system activity events?')) {
        remove(dbRef(database, 'system_activity_logs'));
      }
    });

    lucide.createIcons();
  </script>
</body>
</html>
